<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Reconhecimento Facial</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="icon" type="imagens/logo-image.jfif" href="../imagens/favicon.ico" />
</head>
<body>
  <div id="fundo" aria-hidden="true"></div>

  <main class="card-centered" role="main" aria-labelledby="titulo-login">
    <div class="logo-titulo">
      <img src="../imagens/logo-image.jfif" alt="Logo do serviço" id="logo" class="logo" />
      <h1 id="titulo-login" class="titulo">Facial Recognition</h1>

      <form id="form-login" class="form" aria-label="Formulário de login">
        <label for="input_usuario" class="sr-only">Usuário</label>
        <input type="text" id="input_usuario" name="usuario" class="input" placeholder="Usuário" autocomplete="username" />
        <button id="entrar" class="btn btn-full" type="submit">Seguir para a Câmera</button>
      </form>

  <a id="criar_conta" href="/pages/criar-conta.html" class="link">Criar conta</a>
    </div>

    <footer class="footer">
      <p>© 2024 KRLFP Solutions. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script src="../scripts/api.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
