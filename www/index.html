<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reconhecimento Facial</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="fundo" aria-hidden="true"></div>

  <main id="retangulo_login" role="main" aria-labelledby="titulo-login">
    <div id="logo_titulo">
      <img src="imagens/logo-image.jfif" alt="Logo do serviço" id="logo" />
      <h1 id="titulo-login">Facial Recognition</h1>

      <form id="form-login" aria-label="Formulário de login">
        <label for="input_usuario" class="sr-only">Usuário</label>
        <input type="text" id="input_usuario" name="usuario" placeholder="Usuário" autocomplete="username" />
        <button id="entrar" class="btn" type="submit">Seguir para a Câmera</button>
      </form>

      <a id="criar_conta" href="#" aria-label="Criar conta">Criar conta</a>
    </div>

    <div id="rodape">
      <p>© 2024 KRLFP Solutions. Todos os direitos reservados.</p>
    </div>
  </main>

  <script>
    document.getElementById('form-login').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Prosseguir para reconhecimento facial (protótipo).');
    });
  </script>

  <script src="scripts/api.js"></script>
</body>
</html>
