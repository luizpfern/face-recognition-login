<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Página não encontrada</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="fundo" aria-hidden="true"></div>

  <main id="retangulo_login" role="main" aria-labelledby="titulo-404">
    <div id="logo_titulo" style="gap:14px">
      <img src="imagens/logo-image.jfif" alt="Logo" id="logo" />
      <h1 id="titulo-404">404 — Ops...</h1>

      <div style="width:100%; text-align:center; padding:6px 8px;">
        <p class="lead" style="margin-bottom:6px">A página que você procura não foi encontrada.</p>
        <p class="small" style="margin-bottom:12px">Verifique o endereço ou volte para a página inicial.</p>

        <div style="display:flex; gap:10px; justify-content:center;">
          <a class="btn" href="index.html">Voltar ao início</a>
          <a class="btn" href="criar-conta.html" style="background:transparent;color:var(--accent);box-shadow:none;border:1px solid rgba(7,12,20,0.06);">Criar conta</a>
        </div>
      </div>
    </div>

    <div id="rodape">
      <p>© 2024 KRLFP Solutions.</p>
    </div>
  </main>

  <script>
    // tenta redirecionar corretamente quando aberto de subpastas
    (function(){
      const home = document.querySelector('a[href="index.html"]');
      if(!home) return;
      home.addEventListener('click', function(e){
        // deixa ctrl/meta click funcionar
        if(e.metaKeye.ctrlKeye.shiftKey||e.button===1) return;
      });
    })();
  </script>
</body>
</html>
